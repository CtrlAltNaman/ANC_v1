name: Firmware build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        working-directory: firmware/esp32
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
