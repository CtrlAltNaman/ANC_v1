name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host tests
        run: python -m unittest discover -s tests/unit -v
      - name: Compile Python packages
        run: python -m compileall firmware/esp32/main ml tools tests
